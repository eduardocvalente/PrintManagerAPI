name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # O projeto tem dependência nativa do Windows (System.Drawing.Printing / spooler).
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PrintManagerAPI.sln

      - name: Build (warnings as errors)
        run: dotnet build PrintManagerAPI.sln -c Release --no-restore

      - name: Test
        run: dotnet test PrintManagerAPI.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Audit de dependências vulneráveis
        run: dotnet list PrintManagerAPI.sln package --vulnerable --include-transitive

      - name: Publicar resultados de teste
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
